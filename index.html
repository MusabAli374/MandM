<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mina's Memoires</title>
  </head>

  <body>
    <div id="app">
      <div id="pastel-world">
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>
        <div class="sun-glow"></div>
        <div class="meadow"></div>
      </div>

      <div id="ui">
        <h1>mina's memoires</h1>
        <p id="memory-title">Swipe through the lilies</p>
        <p class="hint">tap the flower to enter a memory</p>
      </div>

      <div id="lily-stage">
        <img id="left-lily" class="lily-img side-lily" alt="" />

        <button id="center-lily-button" aria-label="Open memory">
          <img id="center-lily" class="lily-img center-lily" alt="Selected lily" />
        </button>

        <img id="right-lily" class="lily-img side-lily" alt="" />
      </div>

      <div id="memory-door" class="hidden">
        <div id="blur-bg"></div>
        <div class="door-content">
          <h2 id="door-title">A Memory</h2>
          <p>click to enter this memory</p>
          <button id="enter-memory">enter memory</button>
        </div>
      </div>

      <div id="gallery" class="hidden">
        <button id="close-gallery">×</button>

        <img id="gallery-img" />
        <p id="gallery-caption"></p>

        <div id="spotify-player" class="hidden">
          <iframe
            id="spotify-frame"
            width="100%"
            height="80"
            frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>
        </div>

        <div class="gallery-controls">
          <button id="prev-photo">←</button>
          <button id="next-photo">→</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
